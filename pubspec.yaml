name: roastcalc
description: "A cross-platform calculator application featuring AI-generated roasts and math insights."
publish_to: 'none'
version: 0.1.6+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  math_expressions: ^3.2.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  fonts:
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf